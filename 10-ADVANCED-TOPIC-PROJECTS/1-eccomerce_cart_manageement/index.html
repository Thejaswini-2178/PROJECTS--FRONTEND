<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCart Store</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Live Project</p>
          <h1>SmartCart Store</h1>
          <p class="subtitle">Manage your cart like a real e-commerce app.</p>
        </div>
        <button class="cart-badge" type="button">
          Cart <span id="cart-count">0</span>
        </button>
      </header>

      <main class="layout">
        <section class="products-section">
          <div class="section-heading">
            <h2>Featured Products</h2>
            <p>Popular picks for a modern lifestyle.</p>
          </div>
          <label class="search-box" for="product-search">
            <span>🔍</span>
            <input id="product-search" type="text" placeholder="Search products..." list="product-suggestions" autocomplete="off" />
            <datalist id="product-suggestions"></datalist>
          </label>
          <div id="products" class="products-grid"></div>
        </section>

        <aside class="cart-panel">
          <div class="cart-header">
            <h3>Your Cart</h3>
            <button id="clear-cart" class="link-btn" type="button">Clear</button>
          </div>

          <div id="cart-items" class="cart-items"></div>

          <div class="cart-summary">
            <div class="summary-row">
              <span>Subtotal</span>
              <strong id="subtotal">$0.00</strong>
            </div>
            <div class="summary-row">
              <span>Delivery</span>
              <strong>Free</strong>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <strong id="total">$0.00</strong>
            </div>
            <button id="checkout" class="checkout-btn" type="button">Checkout</button>
          </div>
        </aside>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
